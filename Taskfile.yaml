version: '3'

tasks:
  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check .

  format:
    desc: Run ruff formatter
    cmds:
      - uv run ruff format .

  typecheck:
    desc: Run pyright static type checker
    cmds:
      - uv run pyright

  test:
    desc: Run unit tests (excluding live provider calls)
    cmds:
      - uv run pytest

  test-live:
    desc: Run live provider integration tests
    cmds:
      - uv run pytest -m live

  check:
    desc: Run lint, typecheck, and unit tests
    cmds:
      - uv run ruff check .
      - uv run pyright
      - uv run pytest

  precommit:
    desc: Run the pre-commit hooks (ruff and pyright) on every file
    cmds:
      - uv run pre-commit run --all-files
