# Posivex voice agent stack.
#
# LiveKit (signaling, media and SIP) runs on LiveKit Cloud. Only the agent worker,
# the API and Postgres run here. The agent makes outbound connections to LiveKit
# Cloud, so no inbound SIP/RTP port forwarding is needed on this host.
#
# Required in .env: LIVEKIT_URL (wss://<project>.livekit.cloud), LIVEKIT_API_KEY,
# LIVEKIT_API_SECRET, SIP_OUTBOUND_TRUNK_ID and the AI provider keys.
services:
  postgres:
    image: postgres:16-alpine
    container_name: posivex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-posivex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posivex_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-posivex_calls}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posivex} -d ${POSTGRES_DB:-posivex_calls}"]
      interval: 5s
      timeout: 5s
      retries: 5

  posivex_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posivex_agent
    restart: unless-stopped
    command: ["agent", "start", "--persona", "amelia"]
    env_file:
      - .env
    environment:
      - LIVEKIT_AGENT_NAME=posivex-agent
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-posivex}:${POSTGRES_PASSWORD:-posivex_secure_pass}@postgres:5432/${POSTGRES_DB:-posivex_calls}
    depends_on:
      postgres:
        condition: service_healthy

  posivex_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posivex_api
    restart: unless-stopped
    command: ["dev", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - LIVEKIT_AGENT_NAME=posivex-agent
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-posivex}:${POSTGRES_PASSWORD:-posivex_secure_pass}@postgres:5432/${POSTGRES_DB:-posivex_calls}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
