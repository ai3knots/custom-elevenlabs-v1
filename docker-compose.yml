version: '3.8'

services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: posivex_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-posivex_key}: ${LIVEKIT_API_SECRET:-posivex_secret_change_me_in_production}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: posivex_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: posivex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-posivex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posivex_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-posivex_calls}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posivex} -d ${POSTGRES_DB:-posivex_calls}"]
      interval: 5s
      timeout: 5s
      retries: 5

  posivex_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posivex_agent
    restart: unless-stopped
    command: ["agent", "start", "--persona", "amelia"]
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-posivex}:${POSTGRES_PASSWORD:-posivex_secure_pass}@postgres:5432/${POSTGRES_DB:-posivex_calls}
    depends_on:
      livekit-server:
        condition: service_started
      postgres:
        condition: service_healthy

  posivex_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posivex_api
    restart: unless-stopped
    command: ["dev", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-posivex}:${POSTGRES_PASSWORD:-posivex_secure_pass}@postgres:5432/${POSTGRES_DB:-posivex_calls}
    depends_on:
      postgres:
        condition: service_healthy
      livekit-server:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
