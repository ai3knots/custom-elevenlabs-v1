# Posivex API stack: Postgres and the API (with the webhook outbox worker).
#
# The voice agent runs on LiveKit Cloud (deploy it with scripts/deploy_agent.py), not here. It reports each
# finished call to this API over HTTPS (RESULTS_CALLBACK_URL), so Postgres is only reachable from this stack.
#
# Required in .env: LIVEKIT_URL (wss://<project>.livekit.cloud), LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
# SIP_OUTBOUND_TRUNK_ID, TELEPHONY_PROVIDER=livekit_sip, POSIVEX_API_KEY, ELEVENLABS_WEBHOOK_SECRET,
# LEAD_GEN_WEBHOOK_URL, RESULTS_CALLBACK_SECRET and the AI provider keys (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: posivex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-posivex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posivex_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-posivex_calls}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posivex} -d ${POSTGRES_DB:-posivex_calls}"]
      interval: 5s
      timeout: 5s
      retries: 5

  posivex_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posivex_api
    restart: unless-stopped
    command: ["dev", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    # Lets the containers reach services on this machine (for example lead-gen on its own port) as
    # http://host.docker.internal:<port> if the public URL cannot be reached from inside the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LIVEKIT_AGENT_NAME=posivex-agent
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-posivex}:${POSTGRES_PASSWORD:-posivex_secure_pass}@postgres:5432/${POSTGRES_DB:-posivex_calls}
    # Longer than Docker's 10 s default: on stop the outbox worker finishes the webhook it is delivering (up to 10 s).
    stop_grace_period: 30s
    # Liveness only (the process answers). It lives here, not in the Dockerfile, because the same image runs the
    # agent on LiveKit Cloud, which has no HTTP port. /health/ready also checks the database if you want that instead.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
