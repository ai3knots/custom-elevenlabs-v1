# Runs the project's own pinned ruff and pyright (from uv.lock), so no hook downloads anything.
# Enable it once with:  uv run pre-commit install      Run it on everything with:  uv run pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, with fixes)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyright
        name: pyright (types)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
