environment: "development"
log_level: "INFO"
persona: "amelia"
display_name: "Amelia"
gender: "female"
language: "en"

# Provider Settings
stt:
  provider: "deepgram"
  model: "nova-3"
  language_mode: "en" # "en" | "es" | "multi"
  language: "en-US"
  language_hint:
    - "en"
    - "es"
  endpointing_ms: 25
  interim_results: true
  punctuate: true
  smart_format: false

llm:
  provider: "google"
  default_model: "gemini-3.5-flash"
  fallback_model: "gemini-3.5-flash-lite" # must differ from the primary models
  # For lower latency, try gemini-3.5-flash-lite as default_model (env: LLM_DEFAULT_MODEL).
  temperature: 0.0
  thinking_level: "minimal"
  cascade_timeout: 10.0
  max_retries: 0

tts:
  provider: "elevenlabs"
  model: "eleven_v3_conversational"
  voice_id: "eXpIbVcVbLo8ZJQDlDnl" # Amelia voice
  encoding: "pcm_24000"
  stability: 0.5
  similarity_boost: 0.75
  expressive: true

vad:
  provider: "silero"
  min_speech_duration: 0.05
  min_silence_duration: 0.55
  prefix_padding_duration: 0.5

turn_detector:
  # "vad" | "stt-only" | "v1" | "v1-mini"; multimodal/eou are not available and fall back to vad.
  # Can be overridden without a rebuild via the TURN_DETECTOR_MODE env var.
  mode: "vad"

conversation:
  max_duration_seconds: 900
  silence_end_call_seconds: 15.0 # call ends after this much caller silence
  hold_duration_seconds: 30.0 # skip_turn ("hold on", "let me get them") suspends the silence timer this long
  no_speech_watchdog_seconds: 40.0 # end the call after this long with no transcribed words from the callee (0 disables)
  min_endpointing_delay: 0.5
  max_endpointing_delay: 1.5 # longest wait for a reply the turn detector is unsure has ended (was 4.0)
  opener_delay_seconds: 1.0 # the opening line starts this long after pickup
  opener_quiet_wait_seconds: 1.0 # at most this much extra wait if the callee is mid-sentence at that moment
  machine_detection_enabled: true # fast LLM check for voicemail / phone menus, runs beside the opener
  machine_detection_model: "gemini-3.5-flash-lite"
  machine_detection_window_seconds: 25.0 # stop checking this long after pickup
  machine_detection_confidence: 0.8 # hang up on a machine only at or above this confidence
  max_user_speech_seconds: 8.0 # force an answer when one uninterrupted caller turn runs this long (0 disables)
  interruption_min_words: 1
  interruption_ignore_terms:
    - "mmhmm"
    - "uhhuh"
    - "uh huh"
    - "uh"
    - "mm"
    - "hmm"
    - "okay"
    - "ok"
    - "okey"
    - "i see"
    - "go on"
    - "go ahead"
    - "right"
    - "gotcha"
    - "mmm"
    - "mhm"
    - "ajá"
    - "vale"
    - "ya"
    - "sí"
    - "claro"
    - "entiendo"
    - "dígame"

kb:
  mode: "inline"
  file_path: "prompts/knowledge/Knowledge-base.md"
  max_token_budget: 4000

webhook:
  lead_gen_base_url: "http://localhost:3000"
  webhook_secret: "dev_webhook_secret"
  max_retries: 10
  retry_backoff_base: 2.0

# Agent ids lead-gen may dial with, and the persona (prompt) behind each. An id that is not listed here
# (for example an old ElevenLabs agent) is served by Amelia.
#
# These ids are our own, never an ElevenLabs agent id: lead-gen lists ElevenLabs agents and ours in one dropdown, and a
# shared id (this file used to reuse the ElevenLabs master agent's) makes the two indistinguishable there.
agents:
  - agent_id: "agent_posivex_amelia"
    name: "Posivex LiveKit - Amelia"
    persona: "amelia"
  - agent_id: "agent_posivex_michael"
    name: "Posivex LiveKit - Michael"
    persona: "michael"

# Calling numbers lead-gen can choose. All of them dial through the one SIP trunk (SIP_OUTBOUND_TRUNK_ID).
# Env: VOICE_PHONE_NUMBER_ID / VOICE_PHONE_NUMBER replace this list with a single entry.
phone_numbers:
  - phone_number_id: "phnum_posivex_trunk"
    phone_number: ""
    label: "Posivex LiveKit number"

# Call recording through LiveKit egress to an S3-compatible bucket. Env: RECORDING_ENABLED, RECORDING_BUCKET,
# RECORDING_REGION, RECORDING_ENDPOINT, RECORDING_ACCESS_KEY, RECORDING_SECRET, RECORDING_PREFIX.
recording:
  enabled: false
  prefix: "recordings"
  file_type: "ogg"

telephony:
  provider: "mock"
  sip_trunk_id: null
  max_concurrent_calls: 50

